services:
  - type: web
    name: laravel-app
    env: docker
    branch: main
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://laravel-app.onrender.com
      - key: APP_KEY
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: laravel-db
          property: connectionString
    # preDeployCommand: "php artisan migrate --force"  # opcional; lo activaremos después si lo deseas

databases:
  - name: laravel-db
    plan: free
